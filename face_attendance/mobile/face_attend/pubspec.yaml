name: face_attend
description: "FaceAttend - Face Recognition Attendance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera
  camera: ^0.11.1

  # HTTP client for API calls
  http: ^1.2.1

  # Local storage for user session
  shared_preferences: ^2.3.2

  # Date/time formatting
  intl: ^0.19.0

  # File path utilities
  path_provider: ^2.1.4
  path: ^1.9.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Permission handling
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
